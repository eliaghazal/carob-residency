name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env: { POSTGRES_USER: carob, POSTGRES_PASSWORD: carob, POSTGRES_DB: carob_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carob" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CAROB_DATABASE_URL: postgresql+psycopg://carob:carob@localhost:5432/carob_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.0" }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE: docker compose --project-directory . -f infra/compose.release.yaml -p carob-ci --env-file infra/env/staging.env
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          # The staging example with throwaway values in place of the secrets it leaves empty.
          sed -e 's/^CAROB_IMAGE_TAG=.*/CAROB_IMAGE_TAG=ci/' \
              -e 's/<POSTGRES_PASSWORD>/ci-only-not-a-secret/' \
              -e 's/^\([A-Z_]*\(PASSWORD\|SECRET\|TOKEN\)\)=$/\1=ci-only-not-a-secret/' \
              infra/env/staging.env.example > infra/env/staging.env
          $RELEASE config --quiet
      - name: Build the images
        run: |
          docker build -f infra/docker/python.Dockerfile -t ghcr.io/eliaghazal/carob-api:ci .
          docker build -f infra/docker/web.Dockerfile -t ghcr.io/eliaghazal/carob-web:ci .
      - name: The release stack starts and answers
        run: |
          $RELEASE up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8100/healthz
          curl -fsS http://localhost:8190/healthz
          curl -fsS http://localhost:8180/api/healthz
          curl -fsS -X POST http://localhost:8100/v1/signup -H 'content-type: application/json' \
            -d '{"full_name": "CI Smoke", "email": "ci-smoke@example.com"}' -o /dev/null -w 'signup %{http_code}\n'
      - name: Logs
        if: failure()
        run: $RELEASE logs --no-color --tail 200
